<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="clear">
  <main class="layout">
    <section class="hero panel">
      <p class="eyebrow">Weather Studio</p>
      <h1>See your city in color.</h1>
      <p class="lead">Search any city and get live weather in a visual dashboard.</p>

      <form id="weather-form" class="search-row" autocomplete="off">
        <label class="sr-only" for="city-input">City name</label>
        <input id="city-input" name="city" placeholder="Enter city name" spellcheck="false" autocorrect="off" autocapitalize="none" required>
        <button type="submit">Check Weather</button>
      </form>
      <p id="status" class="status">Enter a city to begin.</p>
    </section>

    <section id="weather-card" class="card panel" hidden>
      <div class="card-top">
        <div>
          <h2 id="location">--</h2>
          <p id="description" class="description">--</p>
        </div>
        <img id="icon" alt="" hidden>
      </div>

      <div class="temperature-row">
        <span id="temperature" class="temperature">--</span>
        <span class="unit">&deg;C</span>
      </div>

      <div class="metric-grid">
        <article class="metric">
          <p class="metric-label">Feels Like</p>
          <p id="feels-like" class="metric-value">--</p>
        </article>
        <article class="metric">
          <p class="metric-label">Humidity</p>
          <p id="humidity" class="metric-value">--</p>
        </article>
        <article class="metric">
          <p class="metric-label">Wind</p>
          <p id="wind" class="metric-value">--</p>
        </article>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
